[project]
name = "papertrader"
version = "0.1.0"
description = "Paper trading engine for Indian index/stock options"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx", "fastapi", "uvicorn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
